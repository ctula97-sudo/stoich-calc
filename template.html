<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>화학량론 계산기</title>
</head>
<body>
  <main>
    <header><h1>화학량론 계산기</h1><p>재료 실험을 위한 원소별 칭량량 계산</p></header>
    <form id="calculator" novalidate>
      <label>계산 모드<select id="mode"><option value="reference">원소별 (기준 원소)</option><option value="total">원소별 (총 질량)</option><option value="mixture-reference">화합물 (기준 화합물)</option><option value="mixture-total">화합물 (총 질량)</option></select></label>
      <label id="formula-wrap"><span id="formula-label">화학식</span><input id="formula" type="text" placeholder="예: ZnGa2Se4" autocomplete="off"><span class="hint">괄호·소수 조성도 계산됩니다 — 예: (Sn0.9Na0.1)0.99Ag0.01Se</span></label>
      <div id="mixture-rows" hidden>
        <div class="mix-head"><span id="mix-ref-head">기준</span><span>화합물</span><span>몰 수</span></div>
        <div id="mix-row-list"></div>
        <button type="button" id="add-mix-row" class="ghost">+ 화합물 추가</button>
      </div>
      <div id="reference-wrap"><label>기준 원소<select id="element"></select></label></div>
      <label><span id="amount-label">기준 원소 질량</span><input id="amount" type="number" min="0" step="any" inputmode="decimal" placeholder="예: 1.0000"></label>
      <label>단위<select id="unit"><option value="g">g</option><option value="mg">mg</option></select></label>
      <button type="submit">계산하기</button>
    </form>
    <p id="error" class="error" role="alert"></p>
    <section id="result" hidden><h2>계산 결과</h2></section>
    <section><div class="row-between"><h2>최근 계산</h2><button type="button" id="clear-history" class="ghost" hidden>전체 지우기</button></div><div id="history"></div></section>
    <section id="feedback">
      <h2>의견 남기기</h2>
      <p class="note">로그인 없이 익명으로 남길 수 있고, 남긴 글은 바로 아래 목록에 표시됩니다.</p>
      <label>이름 (선택)<input id="comment-name" type="text" maxlength="20" placeholder="익명" autocomplete="off"></label>
      <textarea id="comment" rows="3" maxlength="1000" placeholder="예: 과잉 첨가 옵션이 있으면 좋겠습니다 / 이 계산이 이상합니다"></textarea>
      <button type="button" id="send-comment">남기기</button>
      <p id="comment-status" class="note" role="status"></p>
      <div id="comment-list" class="comments"></div>
    </section>
  </main>
  <script src="calc.js"></script><script src="app.js"></script>
</body>
</html>
